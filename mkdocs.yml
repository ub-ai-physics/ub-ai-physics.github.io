site_name: UB AI Physics
site_description: Physics teaching material made by UB students with Claude
site_url: https://ub-ai-physics.github.io/
repo_url: https://github.com/ub-ai-physics/ub-ai-physics.github.io
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins:
  - search
  - tags
nav:
  - Home: index.md
  - Lecture notes:
      - notes/index.md
      - "Example: simple harmonic oscillator": notes/example-harmonic-oscillator.md
  - Simulations:
      - simulations/index.md
  - Solved problems:
      - problems/index.md
      - "Example: block on an incline": problems/example-incline.md
  - Contribute: contribute.md
  - Team: team.md
  - Tags: tags.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
