<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple pendulum</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fafafa; color: #222; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  canvas { background: #fff; border: 1px solid #ddd; border-radius: 8px; max-width: 100%; }
  label { display: block; margin: 8px 0; }
  .wrap { max-width: 640px; margin: auto; }
  .out { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Simple pendulum (example simulation)</h1>
  <p>Change the length and the starting angle. For small angles the period is close to T = 2π √(L/g); for large angles it is longer.</p>
  <canvas id="c" width="600" height="360"></canvas>
  <label>Length L: <span id="Lv"></span> m <input id="L" type="range" min="0.5" max="3" step="0.1" value="1.5"></label>
  <label>Starting angle: <span id="Av"></span>° <input id="A" type="range" min="5" max="170" step="1" value="30"></label>
  <p class="out">Small-angle period: <span id="T0"></span> s · Measured period: <span id="T"></span> s</p>
</div>
<script>
const g = 9.81, c = document.getElementById('c'), ctx = c.getContext('2d');
const Ls = document.getElementById('L'), As = document.getElementById('A');
let L, th, w, t, lastCross, period;
function reset() {
  L = +Ls.value; th = +As.value * Math.PI / 180; w = 0; t = 0; lastCross = null; period = null;
  document.getElementById('Lv').textContent = L.toFixed(1);
  document.getElementById('Av').textContent = As.value;
  document.getElementById('T0').textContent = (2 * Math.PI * Math.sqrt(L / g)).toFixed(3);
  document.getElementById('T').textContent = '…';
}
Ls.oninput = As.oninput = reset;
reset();
function step(dt) {
  // velocity Verlet on theta'' = -(g/L) sin(theta)
  const a = -g / L * Math.sin(th);
  th += w * dt + 0.5 * a * dt * dt;
  const a2 = -g / L * Math.sin(th);
  const wOld = w;
  w += 0.5 * (a + a2) * dt;
  t += dt;
  if (wOld > 0 && w <= 0) {
    if (lastCross !== null) { period = t - lastCross; document.getElementById('T').textContent = period.toFixed(3); }
    lastCross = t;
  }
}
let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05); prev = now;
  for (let i = 0; i < 20; i++) step(dt / 20);
  const ox = c.width / 2, oy = 30, scale = 300 / 3.2;
  const x = ox + L * scale * Math.sin(th), y = oy + L * scale * Math.cos(th);
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = '#999'; ctx.beginPath(); ctx.moveTo(ox - 60, oy); ctx.lineTo(ox + 60, oy); ctx.stroke();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = '#5e35b1'; ctx.beginPath(); ctx.arc(x, y, 14, 0, 2 * Math.PI); ctx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
