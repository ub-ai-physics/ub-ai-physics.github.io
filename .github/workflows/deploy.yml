name: Publica la web
# A cada canvi a main: comprova les dades, construeix la web a _site/ i la publica a la branca gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publica
  cancel-in-progress: true
jobs:
  publica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprova i construeix
        run: python3 scripts/comprova.py --construeix
      - name: Publica a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
