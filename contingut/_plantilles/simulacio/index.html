<!doctype html>
<!--
  PLANTILLA DE SIMULACIÓ
  1. Copia la carpeta contingut/_plantilles/simulacio com a contingut/<nom-del-teu-projecte>/.
  2. Omple el títol, la simulació i les tres seccions d'explicació.
  3. Tot ha d'anar dins d'aquest fitxer (CSS i JS inclosos). Biblioteques externes només de
     cdnjs.cloudflare.com o cdn.jsdelivr.net, amb la versió fixada.
  4. Omple fitxa.yml (assignatures, títol, concepte…).
  Exemple complet: contingut/pendol/
-->
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TÍTOL DE LA SIMULACIÓ</title>
<style>
  :root{ --bg:#F6F8FB; --surface:#fff; --ink:#16233F; --soft:#4A5878; --rule:#D5DDEA; --accent:#2340A8; color-scheme:light; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0F1626; --surface:#162038; --ink:#E7ECF6; --soft:#9DABC8; --rule:#2A3758; --accent:#8FA8FF; color-scheme:dark; } }
  body{ margin:0; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap{ max-width:660px; margin:auto; }
  h1{ font-size:1.35rem; margin:0 0 6px; }
  h2{ font-size:1.05rem; margin:22px 0 6px; }
  canvas{ width:100%; height:auto; background:var(--surface); border:1px solid var(--rule); border-radius:8px; display:block; }
  label{ display:block; margin:10px 0; }
  input[type=range]{ width:100%; }
  p, li{ max-width:70ch; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TÍTOL DE LA SIMULACIÓ</h1>
  <p>Una frase: què pot fer qui la fa servir.</p>

  <canvas id="c" width="600" height="360" aria-label="Descripció breu de l’animació"></canvas>
  <label>Paràmetre: <span id="pv"></span> <input id="p" type="range" min="0" max="1" step="0.01" value="0.5"></label>

  <h2>Què mostra</h2>
  <p>El fenomen i l’equació o el model que hi ha darrere.</p>
  <h2>Què cal observar</h2>
  <ul><li>Què passa quan canvies cada paràmetre.</li></ul>
  <p><small>Mètode numèric i aproximacions. Autoria.</small></p>
</div>
<script>
// Llegeix els colors del tema (clar o fosc) per dibuixar: css('--ink'), css('--accent')…
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const c = document.getElementById('c'), ctx = c.getContext('2d');
function frame(){
  ctx.clearRect(0, 0, c.width, c.height);
  // dibuixa aquí
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
